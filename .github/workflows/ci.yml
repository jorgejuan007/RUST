name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Check
        run: cargo check --locked --all-targets
      - name: Tests
        run: cargo test --locked

  docs-and-practice:
    name: Documentation and exercises
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          components: rustfmt
      - name: Install MkDocs
        run: python -m pip install -r requirements-docs.txt
      - name: Source links
        run: python scripts/check_docs.py
      - name: Python tests and relocation
        run: python -m unittest discover -s tests_python -v
      - name: Exercise templates
        run: |
          cargo fmt --manifest-path ejercicios/Cargo.toml -- --check
          cargo check --locked --manifest-path ejercicios/Cargo.toml
      - name: Reference solutions
        run: python scripts/practica.py verificar-soluciones
      - name: Generate and verify documentation
        run: |
          python scripts/sync_mkdocs.py
          git diff --exit-code -- site_docs
          mkdocs build --strict
      - name: Preserve validated site
        uses: actions/upload-artifact@v7
        with:
          name: docs-site
          path: site
          retention-days: 14
          if-no-files-found: error
