name: Deploy MkDocs

on:
  workflow_run:
    workflows: [CI]
    branches: [main, master]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: ID de un CI exitoso para la revisión actual de main/master
        required: true
        type: string

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Verify CI revision and Pages configuration
        id: validate
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
        run: python scripts/check_pages.py
      - name: Download the site built by CI
        uses: actions/download-artifact@v8
        with:
          name: docs-site
          path: site
          run-id: ${{ steps.validate.outputs.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
