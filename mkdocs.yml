site_name: Curso de Rust en 30 Dias
site_description: Curso practico de Rust con 30 dias, retos, soluciones y material complementario
docs_dir: site_docs
site_dir: site
theme:
  name: readthedocs
extra_css:
  - assets/stylesheets/extra.css
markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - fenced_code
  - md_in_html
  - tables
  - toc:
      permalink: true
nav:
  - Inicio: index.md
  - Curso:
      - Vista general: curso/index.md
      - Guia del repositorio: curso/repositorio.md
      - Manual 30 dias: curso/manual_30_dias.md
  - Base:
      - Indice de complementos: complementos/index.md
      - Guia de estudio: complementos/01_guia_de_estudio_y_habitos.md
      - Modelo mental: complementos/02_modelo_mental_de_rust.md
      - Chuleta: complementos/03_chuleta_rust_y_cargo.md
      - Diagnostico de errores: complementos/04_diagnostico_de_errores_rust.md
      - Glosario: complementos/07_glosario_rust.md
      - Repaso y respuestas: complementos/08_preguntas_de_repaso_y_respuestas.md
      - Antipatrones y buenas practicas: complementos/09_antipatrones_y_buenas_practicas.md
      - Evaluacion final: complementos/11_evaluacion_final_y_rubrica.md
  - Practica:
      - Retos extra: complementos/05_retos_extra_30_dias.md
      - Soluciones orientativas: complementos/10_soluciones_a_retos_extra.md
      - Soluciones ejecutables: complementos/16_soluciones_completas_ejecutables.md
      - Binarios y comandos: referencia/binarios.md
  - Avanzado:
      - Proyectos y siguiente nivel: complementos/06_proyectos_finales_y_siguiente_nivel.md
      - Serde, Clap y Thiserror: complementos/12_serde_clap_thiserror.md
      - Async y Tokio: complementos/13_async_y_tokio.md
      - Arquitectura y refactor: complementos/14_arquitectura_y_refactor_en_rust.md
      - Ruta postcurso: complementos/15_ruta_postcurso.md
      - Automatizacion y publicacion: complementos/17_automatizacion_y_publicacion.md
      - Errores, I O y Anyhow: complementos/18_errores_io_y_anyhow.md
      - Smart pointers y mutabilidad interior: complementos/19_smart_pointers_y_mutabilidad_interior.md
      - Async practico con Tokio: complementos/20_async_practico_con_tokio.md
      - Tests de integracion y doctests: complementos/21_tests_de_integracion_y_doctests.md
      - Cargo profesional y workspaces: complementos/22_cargo_profesional_y_workspaces.md
  - Referencia:
      - Codigo y datos: referencia/index.md
      - Guia de codigo fuente: referencia/codigo.md
      - Guia de datos: referencia/data.md
      - Guia de infraestructura: referencia/infra.md
