[package]
name = "rust_30_dias"
version = "0.1.0"
edition = "2021"
default-run = "rust_30_dias"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5.8", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "time"] }
