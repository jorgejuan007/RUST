name: CI

on:
  push:
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install MkDocs
        run: pip install -r requirements-docs.txt

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Regenerate MkDocs source
        run: make sync-docs

      - name: Cargo check
        run: make check

      - name: Cargo test
        run: make test

      - name: Build docs
        run: make docs-build
